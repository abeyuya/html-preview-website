<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML / Markdown プレビュー</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>HTML / Markdown プレビュー</h1>
    <p class="app-desc">下の入力欄に HTML または Markdown を貼り付けると、右側にレンダリング結果が自動で表示されます。Markdown では Mermaid 図にも対応しています。</p>
  </header>

  <main class="app-main">
    <section class="pane pane-input">
      <div class="pane-toolbar">
        <label for="html-input" class="pane-title">入力</label>
        <div class="toolbar-right">
          <div class="mode-switch" role="radiogroup" aria-label="入力モード">
            <label class="mode-option">
              <input type="radio" name="mode" value="html" checked>
              <span>HTML</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="markdown">
              <span>Markdown</span>
            </label>
          </div>
          <button id="clear-btn" type="button" class="btn btn-ghost">クリア</button>
        </div>
      </div>
      <textarea
        id="html-input"
        class="html-input"
        spellcheck="false"
        placeholder="<h1>Hello, world!</h1>"
        aria-label="入力"></textarea>
      <div class="actions">
        <button id="open-tab-btn" type="button" class="btn btn-secondary">新規タブで開く</button>
      </div>
    </section>

    <section class="pane pane-preview">
      <div class="pane-toolbar">
        <span class="pane-title">プレビュー</span>
      </div>
      <iframe
        id="preview-frame"
        class="preview-frame"
        title="プレビュー"
        sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
